{% load tz %}
<div class="comment" data-id="{{ comment.pk }}">
  <strong>{{ comment.author.username }}</strong> <small>{{ comment.created_at|timezone:"Asia/Jakarta"|date:"d M Y, H:i" }}</small>
  <p>{{ comment.content|linebreaksbr }}</p>
  {% if comment.author_id == user.id %}
  <span class="comment-actions">
    <button type="button" class="js-comment-edit" data-action="{% url 'community:edit_comment' comment.pk %}" data-content="{{ comment.content }}">Edit</button>
    <form method="post" action="{% url 'community:delete_comment' comment.pk %}" class="js-comment-delete-form">
      {% csrf_token %}
      <button type="submit">Hapus</button>
    </form>
  </span>
  {% endif %}
</div>
